<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
Bonjour <span th:text="${firstname}"></span>,

<p>
  Suite à la sélection des billets pour la billetterie du BreizhCamp <span th:text="${year}"></span>,
  <span th:if="${!groupPayment} or ${nbPersons} == 1">
    vous êtes
  </span>
  <span th:if="${groupPayment} and ${nbPersons} > 1">
    votre groupe de <span th:text="${nbPersons}"></span> est
  </span>
  actuellement en liste d'attente.
</p>

<p>
  Nous vous recontacterons dans le cas où des places se libèrent.
</p>

<p>
  Cordialement,<br>
  L'équipe du BreizhCamp
</p>

</body>
